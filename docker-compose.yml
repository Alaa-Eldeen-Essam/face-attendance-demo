services:
  db:
    image: pgvector/pgvector:pg16
    container_name: face_attendance_demo_db
    environment:
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance
      POSTGRES_DB: attendance_demo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance -d attendance_demo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
